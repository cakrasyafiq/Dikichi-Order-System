# WHY: behind a Cloudflare tunnel every request shares one origin IP, so the real client IP header is preferred.
map $http_cf_connecting_ip $client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

limit_req_zone $client_key zone=login:1m rate=10r/m;

server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    resolver 127.0.0.11 valid=10s ipv6=off;

    include /etc/nginx/snippets/security-headers.conf;

    location = /api/v1/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        include /etc/nginx/snippets/proxy-gateway.conf;
    }

    location /api/ {
        include /etc/nginx/snippets/proxy-gateway.conf;
    }

    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location ~ ^/(login|cashier|kitchen|master)(/|$) {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        try_files /index.html =404;
    }

    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
