server:
  port: 8082

spring:
  application:
    name: order-service
  datasource:
    url: ${ORDER_DB_URL}
    username: ${ORDER_DB_USER}
    password: ${ORDER_DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

dikichi:
  catalog:
    base-url: ${CATALOG_BASE_URL:http://catalog-service:8081}
    connect-timeout: 2s
    read-timeout: 3s

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ecs
