server:
  port: 8080

spring:
  application:
    name: gateway-service

dikichi:
  jwt:
    secret: ${JWT_SECRET}
  upstream:
    catalog: ${CATALOG_BASE_URL:http://catalog-service:8081}
    order: ${ORDER_BASE_URL:http://order-service:8082}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  structured:
    format:
      console: ecs
